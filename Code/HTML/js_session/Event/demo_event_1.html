<!-- Khai báo phiên bản html5 -->
<!DOCTYPE html>
<html lang="en">
<!-- head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </script>
</head>
<body>
    <!-- Internal JS -->
    <script>
        /* 
            1. Nhập 2 số a, b từ bàn phím.
            Tính +, -, *, / của 2 số

            Gợi ý:
            - Dùng form để nhập dữ liệu
            - Lấy được giá trị đã được nhập khi mà dữ liệu được gửi đi khi click vào nút gửi
                => dùng sự kiện onclick
                + Tạo function để lấy dữ liệu
                + Ở button, thêm sự kiện onclick gọi đến function vừa tạo
                + Trong function: viết code để lấy giá trị của thẻ input
            - Tính giá trị và hiển thị ra màn hình

            Lưu ý: dữ liệu lấy về từ ô input luôn có kiểu dữ liệu là String
                => String + String -> Nối 2 chuỗi với nhau
        */

        function tinh(){
            // Lấy dữ liệu của a
            var a = Number(document.getElementById("number_a").value);
            // Lấy dữ liệu của b
            var b = Number(document.getElementById("number_b").value);
            // Tính
            var tong = a + b;
            var hieu = a - b;
            var tich = a * b;
            var thuong = a / b;
            // Hiển thị kết quả
            document.getElementById("result_tong").innerHTML = "a + b = " + tong;
            document.getElementById("result_hieu").innerHTML = "a - b = " + hieu;
            document.getElementById("result_tich").innerHTML = "a * b = " + tich;
            document.getElementById("result_thuong").innerHTML = "a / b = " + thuong;
        }
    </script>

    <!-- Tạo form để nhập dữ liệu -->
    <form>
        a: <input type="text" id="number_a"><br>
        b: <input type="text" id="number_b"><br>
        <button type="button" onclick="tinh()">Tính</button><br>
        <span id="result_tong"></span><br>
        <span id="result_hieu"></span><br>
        <span id="result_tich"></span><br>
        <span id="result_thuong"></span><br>
    </form>
</body>
