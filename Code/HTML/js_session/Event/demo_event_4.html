<!-- Khai báo phiên bản html5 -->
<!DOCTYPE html>
<html lang="en">
<!-- head -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </script>
</head>
<body>
    <!-- Internal JS -->
    <script>
        /* 
            4. Nhập a số nguyên từ bàn phím.
            Hiển thị lần lượt các số trong khoảng từ 1 -> a
        */
        
        function ketQua(){
            var a = Number(document.getElementById("num_a").value);
            var result = "";
            for(var i = 1; i <= a; i++){
                result += i + ",";
            }
            document.getElementById("result").innerHTML = result;
        }
    </script>
    <form>
        a: <input type="text" id="num_a"><br>
        <span id="result"></span><br>
        <button type="button" onclick="ketQua()">Kết quả</button>
    </form>
    
</body>
